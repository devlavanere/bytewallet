<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ByteWallet - Lista de Transações</title>
</head>
<body>

    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">ByteWallet</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/transacoes/list}">Meu Extrato</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contas/form}">Nova Conta</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <h1>Extrato de Transações</h1>

    <!-- Mensagem de sucesso (PRG) -->
    <div th:if="${mensagem != null}" th:text="${mensagem}" style="color: green; font-weight: bold;"></div>

    <a th:href="@{/transacoes/form}"><button>Nova Transação</button></a>
    <br/><br/>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Descrição</th>
                <th>Valor (R$)</th>
                <th>Comentários</th>
                <th>Ações da Transação</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${transacoes}">
                <td th:text="${t.id}"></td>
                
                <!-- Formata a data direto no Thymeleaf -->
                <td th:text="${#dates.format(t.data, 'dd/MM/yyyy')}"></td>
                
                <td th:text="${t.descricao}"></td>
                <td th:text="${t.valor}"></td>
                
                <!-- Coluna para exibir os comentários vinculados -->
                <td>
                    <ul>
                        <li th:each="com : ${t.comentarios}">
                            <span th:text="${com.texto}"></span>
                            <!-- UC06: Excluir Comentário -->
                            <a th:href="@{/comentarios/excluir/{id}(id=${com.id})}" style="color: red; font-size: 12px;">[X]</a>
                        </li>
                    </ul>
                </td>

                <!-- Coluna de Ações -->
                <td>
                    <!-- UC04: Editar Transação -->
                    <a th:href="@{/transacoes/editar/{id}(id=${t.id})}"><button>Editar Transação</button></a>
                    
                    <!-- UC05: Adicionar Comentário -->
                    <a th:href="@{/comentarios/form/{id}(id=${t.id})}"><button>Comentar</button></a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
