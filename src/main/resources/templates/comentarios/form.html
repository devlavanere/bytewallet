<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Adicionar Comentário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">ByteWallet</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/transacoes/list}">Meu Extrato</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contas/form}">Nova Conta</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-secondary text-white py-3">
                        <h4 class="mb-0">Adicionar Comentário</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/comentarios/save}" method="POST" th:object="${comentario}">
                            
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{transacao.id}" />

                            <div class="mb-4">
                                <label for="texto" class="form-label fw-bold">Escreva sua observação:</label>
                                <textarea id="texto" th:field="*{texto}" class="form-control" rows="4" placeholder="Detalhes da compra, motivo do gasto..." required></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/transacoes/list}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-secondary px-4 fw-bold">Salvar Comentário</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
