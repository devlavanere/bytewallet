<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Minhas Contas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar do Correntista -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">ByteWallet</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/contas/list}">Minhas Contas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/transacoes/list}">Extrato de Transações</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-primary mb-0">Minhas Contas</h1>
            <a th:href="@{/contas/form}" class="btn btn-success fw-bold">+ Nova Conta</a>
        </div>

        <div th:if="${mensagem != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <strong th:text="${mensagem}"></strong>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Descrição / Banco</th>
                            <th>Número</th>
                            <th>Tipo</th>
                            <th>Correntista</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loop nas contas -->
                        <tr th:each="c : ${contas}">
                            <td class="ps-3 fw-bold text-secondary" th:text="${c.id}"></td>
                            <td th:text="${c.descricao}"></td>
                            <td th:text="${c.numero}"></td>
                            <td>
                                <!-- Destaque visual (Badge) para o tipo da conta -->
                                <span class="badge" 
                                      th:classappend="${c.tipo == 'CORRENTE'} ? 'bg-primary' : 'bg-warning text-dark'"
                                      th:text="${c.tipo == 'CORRENTE' ? 'Conta Corrente' : 'Cartão de Crédito'}">
                                </span>
                            </td>
                            <td th:text="${c.correntista.nome}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contas)}">
                            <td colspan="5" class="text-center py-4 text-muted">Nenhuma conta cadastrada.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
