<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Cadastro de Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">ByteWallet</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/transacoes/list}">Meu Extrato</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contas/form}">Nova Conta</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div th:if="${mensagem != null}" class="alert alert-success" role="alert">
                    <strong th:text="${mensagem}"></strong>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white py-3">
                        <h4 class="mb-0">Cadastro de Conta</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/contas/save}" method="POST" th:object="${conta}">
                            
                            <div class="mb-3">
                                <label for="numero" class="form-label fw-bold">Número da Conta:</label>
                                <input type="text" id="numero" th:field="*{numero}" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label for="descricao" class="form-label fw-bold">Instituição (ex: Nubank, BB):</label>
                                <input type="text" id="descricao" th:field="*{descricao}" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label for="tipo" class="form-label fw-bold">Tipo de Conta:</label>
                                <select id="tipo" th:field="*{tipo}" class="form-select">
                                    <option value="CORRENTE">Conta Corrente</option>
                                    <option value="CARTAO">Cartão de Crédito</option>
                                </select>
                            </div>

                            <div class="mb-4">
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Correntista Titular:</label>
                                <!-- Pega o nome direto da sessão -->
                                <input type="text" class="form-control text-muted bg-light" 
                                    th:value="${session.correntistaLogado.nome}" readonly />
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary fw-bold">Salvar Conta</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
