<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Cadastro de Correntista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Superior (Perfil Administrador) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                ByteWallet <span class="badge bg-secondary fs-6 ms-2">Admin</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <!-- Links exclusivos do Administrador -->
                    <li class="nav-item"><a class="nav-link" th:href="@{/correntistas/list}">Gerenciar Correntistas</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link text-warning" th:href="@{/}">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div th:if="${mensagem != null}" class="alert alert-success" role="alert">
                    <strong th:text="${mensagem}"></strong>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="mb-0">Novo Correntista</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/correntistas/save}" method="POST" th:object="${correntista}">
                            
                            <!-- Campo Nome Completo -->
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-bold">Nome Completo:</label>
                                <!-- th:errorclass aplica a borda vermelha do Bootstrap se o Spring detectar erro -->
                                <input type="text" id="nome" th:field="*{nome}" class="form-control form-control-lg" th:errorclass="is-invalid" placeholder="Digite o nome..." />
                                <!-- th:errors exibe a mensagem de erro customizada da sua Entidade -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>

                            <!-- Campo CPF -->
                            <div class="mb-3">
                                <label for="cpf" class="form-label fw-bold">CPF:</label>
                                <input type="text" id="cpf" th:field="*{cpf}" class="form-control form-control-lg" th:errorclass="is-invalid" placeholder="000.000.000-00" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                            </div>

                            <!-- Campo Data de Nascimento -->
                            <div class="mb-3">
                                <label for="dataNascimento" class="form-label fw-bold">Data de Nascimento:</label>
                                <input type="date" id="dataNascimento" th:field="*{dataNascimento}" class="form-control form-control-lg" th:errorclass="is-invalid" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                            </div>

                            <!-- Campo Endereço -->
                            <div class="mb-4">
                                <label for="endereco" class="form-label fw-bold">Endereço Completo:</label>
                                <input type="text" id="endereco" th:field="*{endereco}" class="form-control form-control-lg" th:errorclass="is-invalid" placeholder="Ex: Rua, Número, Bairro, Cidade" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}"></div>
                            </div>

                            <!-- Botões de Ação -->
                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <a th:href="@{/correntistas/list}" class="text-decoration-none text-muted">Ver todos</a>
                                <button type="submit" class="btn btn-success btn-lg fw-bold px-4">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
