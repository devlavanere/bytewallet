<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Cadastro de Correntista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div th:if="${mensagem != null}" class="alert alert-success" role="alert">
                    <strong th:text="${mensagem}"></strong>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="mb-0">Novo Correntista</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/correntistas/save}" method="POST" th:object="${correntista}">
                            
                            <div class="mb-4">
                                <label for="nome" class="form-label fw-bold">Nome Completo:</label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control form-control-lg" required placeholder="Digite o nome..." />
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/correntistas/list}" class="text-decoration-none text-muted">Ver todos</a>
                                <button type="submit" class="btn btn-success btn-lg fw-bold px-4">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
