<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Correntistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-dark mb-0">Correntistas Cadastrados</h1>
            <a th:href="@{/correntistas/form}" class="btn btn-success fw-bold">+ Novo Correntista</a>
        </div>

        <div th:if="${mensagem != null}" class="alert alert-success" role="alert">
            <strong th:text="${mensagem}"></strong>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome do Correntista</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="correntista : ${correntistas}">
                            <td class="ps-4 fw-bold text-secondary" th:text="${correntista.id}"></td>
                            <td th:text="${correntista.nome}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
