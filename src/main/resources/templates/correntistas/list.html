<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Correntistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Superior (Perfil Administrador) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                ByteWallet <span class="badge bg-secondary fs-6 ms-2">Admin</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <!-- Links exclusivos do Administrador -->
                    <li class="nav-item"><a class="nav-link active" th:href="@{/correntistas/list}">Gerenciar Correntistas</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link text-warning" th:href="@{/}">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-dark mb-0">Correntistas Cadastrados</h1>
            <a th:href="@{/correntistas/form}" class="btn btn-success fw-bold">+ Novo Correntista</a>
        </div>

        <div th:if="${mensagem != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <strong th:text="${mensagem}"></strong>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome do Correntista</th>
                            <th>CPF</th>
                            <th>Idade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lista os correntistas -->
                        <tr th:each="correntista : ${correntistas}">
                            <td class="ps-4 fw-bold text-secondary" th:text="${correntista.id}"></td>
                            <td class="fw-bold" th:text="${correntista.nome}"></td>
                            <td th:text="${correntista.cpf}"></td>
                            <td th:text="${correntista.idade + ' anos'}"></td>
                        </tr>
                        
                        <!-- Mensagem caso a lista esteja vazia -->
                        <tr th:if="${#lists.isEmpty(correntistas)}">
                            <td colspan="4" class="text-center py-4 text-muted">Nenhum correntista cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
