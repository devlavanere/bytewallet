<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag obrigatória para responsividade em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Extrato de Transações</title>
    <!-- CSS do Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Container centraliza o conteúdo e dá margem -->
    <div class="container mt-5">
        
        <!-- Cabeçalho com o título e o botão de nova transação alinhados -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-primary mb-0">Extrato de Transações</h1>
            <a th:href="@{/transacoes/form}" class="btn btn-success fw-bold">+ Nova Transação</a>
        </div>

        <!-- Alerta de sucesso dinâmico -->
        <div th:if="${mensagem != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <strong th:text="${mensagem}"></strong>
        </div>

        <!-- Card branco envolvendo a tabela com sombra leve -->
        <div class="card shadow-sm">
            <div class="card-body p-0 table-responsive">
                
                <!-- Tabela responsiva com hover e bordas discretas -->
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Valor (R$)</th>
                            <th>Comentários</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${transacoes}">
                            <td class="ps-3 fw-bold text-secondary" th:text="${t.id}"></td>
                            <td th:text="${#dates.format(t.data, 'dd/MM/yyyy')}"></td>
                            <td th:text="${t.descricao}"></td>
                            
                            <!-- Destaca o valor financeiro -->
                            <td class="fw-bold text-dark" th:text="${'R$ ' + t.valor}"></td>
                            
                            <!-- Lista de comentários sem as bolinhas padrão (list-unstyled) -->
                            <td>
                                <ul class="list-unstyled mb-0">
                                    <li th:each="com : ${t.comentarios}" class="mb-1 d-flex justify-content-between align-items-center border-bottom pb-1">
                                        <span class="text-muted small" th:text="${com.texto}"></span>
                                        <a th:href="@{/comentarios/excluir/{id}(id=${com.id})}" class="btn btn-sm btn-outline-danger py-0 px-2 ms-2 border-0" title="Excluir Comentário">X</a>
                                    </li>
                                </ul>
                            </td>

                            <!-- Botões de ação em grupo -->
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/transacoes/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                    <a th:href="@{/comentarios/form/{id}(id=${t.id})}" class="btn btn-sm btn-outline-secondary">Comentar</a>
                                </div>
                            </td>
                        </tr>
                        <!-- Caso a lista esteja vazia -->
                        <tr th:if="${#lists.isEmpty(transacoes)}">
                            <td colspan="6" class="text-center py-4 text-muted">Nenhuma transação encontrada.</td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

</body>
</html>
