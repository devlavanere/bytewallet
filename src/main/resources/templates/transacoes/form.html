<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteWallet - Lançar Transação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">ByteWallet</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/transacoes/list}">Meu Extrato</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contas/form}">Nova Conta</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div th:if="${mensagem != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong th:text="${mensagem}"></strong>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0">Lançar Transação</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/transacoes/save}" method="POST" th:object="${transacao}">
                            
                            <!-- Campo Oculto para Edição -->
                            <input type="hidden" th:field="*{id}" />

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="data" class="form-label fw-bold">Data:</label>
                                    <input type="date" id="data" th:field="*{data}" class="form-control" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="valor" class="form-label fw-bold">Valor (R$):</label>
                                    <input type="number" step="0.01" id="valor" th:field="*{valor}" class="form-control" placeholder="0,00" required />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="descricao" class="form-label fw-bold">Descrição:</label>
                                <input type="text" id="descricao" th:field="*{descricao}" class="form-control" placeholder="Ex: Compra no mercado" required />
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label for="movimento" class="form-label fw-bold">Movimento:</label>
                                    <select id="movimento" th:field="*{movimento}" class="form-select">
                                        <option value="D">Débito (Saída)</option>
                                        <option value="C">Crédito (Entrada)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="conta" class="form-label fw-bold">Conta:</label>
                                    <select id="conta" th:field="*{conta.id}" class="form-select" required>
                                        <option th:each="c : ${contasItems}" th:value="${c.id}" th:text="${c.descricao + ' - ' + c.numero}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="categoria" class="form-label fw-bold">Categoria:</label>
                                    <select id="categoria" th:field="*{categoria.id}" class="form-select" required>
                                        <option th:each="cat : ${categoriasItems}" th:value="${cat.id}" th:text="${cat.nome + ' (' + cat.natureza + ')'}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/transacoes/list}" class="btn btn-outline-secondary">Voltar para Extrato</a>
                                <button type="submit" class="btn btn-success px-4 fw-bold">Registrar Transação</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
